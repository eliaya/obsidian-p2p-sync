# Push a tag equal to the version in manifest.json (no "v" prefix) to publish a release Obsidian can install from.
name: Release plugin

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Tag must match manifest.json
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest version $v"; exit 1; }
      - name: Build and test
        working-directory: plugin
        run: |
          npm ci
          npm test
          npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes plugin/main.js manifest.json plugin/styles.css
